<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>靈感藏所 · Prompt Atlas</title>
<style>
:root{--bg:#f5f3ee;--ink:#263a34;--muted:#748079;--line:#dcded6;--accent:#d9e78d}[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 15px;color:var(--ink)}button:hover{background:#edf0e5}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #9eb36c;outline-offset:2px}.primary{background:var(--ink);color:white;border-color:var(--ink)}.primary:hover{background:#40594f}.accent{background:var(--accent)}header{border-bottom:1px solid var(--line);padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:750;letter-spacing:2px}.brand small{display:block;font-size:10px;letter-spacing:3px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}main{max-width:1500px;margin:auto;padding:40px 5%}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--muted)}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-1px;margin:10px 0}p{color:var(--muted)}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px;gap:16px}.stats{font-size:12px;white-space:nowrap}.stats strong{font-size:34px;color:var(--ink)}.tools{display:flex;gap:10px;flex-wrap:wrap}.tools input{flex:1;min-width:170px}input,textarea,select{border:1px solid var(--line);padding:12px;border-radius:10px;background:white;color:var(--ink)}#tags{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{font-size:12px;border-radius:30px;padding:6px 13px}.selected{background:var(--ink);color:#fff}.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:25px 0 15px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.card{border:1px solid var(--line);border-radius:14px;background:white;overflow:hidden;display:flex;flex-direction:column}.picture{border:0;border-radius:0;padding:12px;width:100%;height:245px;background:#eeede7;display:flex;align-items:center;justify-content:center}.picture img{max-width:100%;max-height:100%;object-fit:contain}.placeholder{font-size:35px;color:#9eaa98}.cardbody{padding:16px;display:flex;flex-direction:column;flex:1}.card h3{font-size:15px;margin:0 0 6px}.card p{font-size:12px;margin:0 0 15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card .actions{margin-top:auto;flex-wrap:nowrap}.card .copy{flex:1}.empty{grid-column:1/-1;text-align:center;padding:65px 20px;border:1px dashed #b9c2b3;border-radius:15px}.empty h2{font-weight:500}.note{font-size:12px;color:var(--muted);margin-top:28px}dialog{border:1px solid var(--line);border-radius:18px;padding:0;max-width:950px;width:calc(100% - 30px);max-height:90dvh;color:var(--ink);background:var(--bg)}dialog::backdrop{background:#17231f99;backdrop-filter:blur(4px)}.dialoghead{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.dialoghead h2{margin:0;font-size:20px}.dialogbody{padding:24px;max-height:70dvh;overflow:auto}.detail{display:grid;grid-template-columns:1fr 1fr;gap:25px}.detail img{width:100%;max-height:60vh;object-fit:contain;cursor:zoom-in}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.8 system-ui;margin:15px 0}.field{display:block;margin-bottom:16px}.field input,.field textarea{width:100%;display:block;margin-top:6px}.field textarea{min-height:240px;resize:vertical}#editPreview{max-height:180px;max-width:100%;display:block}.foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:end;gap:10px}.danger{color:#a33835}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#263a34;color:white;padding:12px 22px;border-radius:12px;z-index:100;max-width:90%;display:none}#lightbox{max-width:95vw}#lightbox img{max-width:100%;max-height:80vh;object-fit:contain}#more{display:block;margin:25px auto}.error{color:#a33835}summary{cursor:pointer} @media(min-width:1400px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){header{padding:14px 5%;align-items:start}.brand{font-size:14px}.actions button{padding:9px 12px;font-size:13px}main{padding-top:27px}.intro{display:block}.stats{margin-top:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.picture{height:190px;padding:8px}.cardbody{padding:11px}.card h3{font-size:14px}.detail{grid-template-columns:1fr}.dialogbody{padding:16px}.meta{gap:10px}.tools select{max-width:135px}}
</style>
<header><div class="brand">◈ 靈感藏所<small>PROMPT ATLAS</small></div><nav class="actions"><button id="importBtn">匯入</button><button id="exportBtn">備份 ↓</button><button class="primary" id="newBtn">＋ 新增</button></nav></header>
<main><section class="intro"><div><div class="eyebrow">YOUR PERSONAL CREATIVE ARCHIVE</div><h1>把靈感，留給下一次創作。</h1><p>看圖找風格，讓每一段 Prompt 都能再次發光。</p></div><div class="stats"><strong id="total">0</strong> 筆收藏 · <span id="imageCount">0</span> 張圖片</div></section><div class="tools"><input id="search" type="search" aria-label="搜尋收藏" placeholder="搜尋名稱、Prompt 或標籤…"><button id="favFilter" aria-pressed="false">☆ 常用收藏</button><select id="sort" aria-label="排序"><option value="created">最近新增</option><option value="updated">最近修改</option><option value="used">最近使用</option><option value="title">名稱排序</option></select></div><div id="tags"></div><div class="meta"><span id="result">讀取收藏中…</span><span id="backupState">尚未備份</span></div><div class="grid" id="grid"></div><button id="more" hidden>載入更多</button><p class="note">● 僅儲存在此瀏覽器，不上傳收藏。請定期備份；換裝置或清除網站資料前，先匯出 JSON。</p></main>
<dialog id="viewer"><div class="dialoghead"><h2 id="viewTitle"></h2><button data-close="viewer" aria-label="關閉">✕</button></div><div class="dialogbody detail"><div id="viewImage"></div><div><div id="viewTags"></div><div class="actions"><button id="viewCopy" class="primary">複製 Prompt</button><button id="editBtn">編輯</button></div><pre id="viewText"></pre></div></div></dialog>
<dialog id="editor"><form id="editForm"><div class="dialoghead"><h2 id="editHeading">新增收藏</h2><button type="button" id="cancelTop" aria-label="關閉">✕</button></div><div class="dialogbody"><label class="field">名稱<input id="titleInput" required maxlength="300"></label><label class="field">標籤（以逗號分隔）<input id="tagsInput" placeholder="極簡, 海報, 人物"></label><label class="field">預覽圖片<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><img id="editPreview" alt="預覽"><button type="button" id="removeImage">移除圖片</button><label class="field">完整 Prompt<textarea id="textInput" placeholder="貼上你的繪圖提示詞…"></textarea></label><label><input id="favoriteInput" type="checkbox"> 設為常用收藏</label></div><div class="foot"><button type="button" class="danger" id="deleteBtn">刪除</button><button type="button" id="cancelEdit">取消</button><button class="primary" id="saveBtn">儲存</button></div></form></dialog>
<dialog id="importer"><div class="dialoghead"><h2>匯入收藏</h2><button data-close="importer" aria-label="關閉">✕</button></div><div class="dialogbody"><p>支援舊版 CardsBackup 與新版備份。圖片與 Prompt 會保留原始內容。</p><input id="importFile" type="file" accept=".json,application/json" aria-label="選擇備份 JSON"><p id="importInfo">選擇 JSON 後先檢查，再開始匯入。</p><label class="field">匯入方式<select id="importMode"><option value="merge">合併收藏（跳過內容完全相同的項目）</option><option value="replace">覆蓋新版收藏（不影響舊版資料庫）</option></select></label><p>覆蓋前請先備份。整批匯入成功才會寫入，失敗時保留原有資料。</p></div><div class="foot"><button class="primary" id="confirmImport" disabled>確認匯入</button></div></dialog>
<dialog id="lightbox"><div class="dialoghead"><span>完整圖片</span><button data-close="lightbox">關閉</button></div><div class="dialogbody"><img id="largeImage" alt="收藏完整圖片"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let db,items=[],activeTags=new Set(),onlyFav=false,limit=24,current=null,editing=null,editImage='',pending=null,dirty=false,busy=false,timer;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',4500)}
function fail(e){console.error(e);toast('操作失敗：'+(e.message||e)+'。原備份檔不受影響。')}
function node(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}
function button(txt,fn,cls){const b=node('button',txt,cls);b.type='button';b.onclick=()=>Promise.resolve().then(fn).catch(fail);return b}
function validImage(s){return typeof s==='string'&&/^data:image\/(jpeg|jpg|png|webp|gif);base64,[A-Za-z0-9+/\s]*={0,2}$/.test(s)}
function normalise(raw){const a=Array.isArray(raw)?raw:raw&&raw.items;if(!Array.isArray(a))throw Error('檔案必須包含收藏陣列');return a.map((r,i)=>{if(!r||typeof r!=='object'||typeof r.text!=='string'||(r.title!=null&&typeof r.title!=='string')||(r.img!=null&&typeof r.img!=='string')||(r.img&&!validImage(r.img)))throw Error('第 '+(i+1)+' 筆資料格式不符');if(r.tags!=null&&(!Array.isArray(r.tags)||!r.tags.every(t=>typeof t==='string')))throw Error('第 '+(i+1)+' 筆標籤格式錯誤');const date=typeof r.date==='string'&&Number.isFinite(Date.parse(r.date))?r.date:new Date().toISOString();return {id:uid(),title:r.title||'',text:r.text,img:r.img||'',date,updatedAt:r.updatedAt||date,lastUsed:r.lastUsed||'',tags:[...new Set(r.tags||[])],favorite:!!r.favorite}})}
function transact(fn){return new Promise((resolve,reject)=>{const t=db.transaction('prompts','readwrite');t.oncomplete=resolve;t.onerror=()=>reject(t.error||Error('寫入失敗'));t.onabort=()=>reject(t.error||Error('寫入已取消'));try{fn(t.objectStore('prompts'))}catch(e){t.abort();reject(e)}})}
async function reload(){items=await new Promise((res,rej)=>{const q=db.transaction('prompts').objectStore('prompts').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});render()}
async function save(r){await transact(s=>s.put(r));const i=items.findIndex(x=>x.id===r.id);if(i<0)items.push(r);else items[i]=r;render()}
function render(){const q=$('search').value.trim().toLocaleLowerCase();let arr=items.filter(r=>(!onlyFav||r.favorite)&&[...activeTags].every(t=>t==='未分類'?!r.tags.length:r.tags.includes(t))&&(!q||[r.title,r.text,...r.tags].join(' ').toLocaleLowerCase().includes(q)));const time=r=>Date.parse(r)||0;arr.sort((a,b)=>$('sort').value==='title'?a.title.localeCompare(b.title,'zh-Hant'):time($('sort').value==='used'?b.lastUsed:$('sort').value==='updated'?b.updatedAt:b.date)-time($('sort').value==='used'?a.lastUsed:$('sort').value==='updated'?a.updatedAt:a.date));$('total').textContent=items.length;$('imageCount').textContent=items.filter(r=>r.img).length;$('result').textContent=arr.length+' 筆收藏'+(activeTags.size?' · 標籤交集篩選':'');$('tags').replaceChildren(button('全部',()=>{activeTags.clear();render()},'chip '+(!activeTags.size?'selected':'')));const ts=[...new Set(items.flatMap(r=>r.tags))].sort();if(items.some(r=>!r.tags.length))ts.unshift('未分類');ts.forEach(t=>$('tags').append(button(t,()=>{activeTags.has(t)?activeTags.delete(t):activeTags.add(t);limit=24;render()},'chip '+(activeTags.has(t)?'selected':''))));$('grid').replaceChildren();if(!arr.length){const e=node('div',undefined,'empty');e.append(node('div','◈','placeholder'),node('h2',items.length?'沒有符合的收藏':'你的下一個靈感，從這裡開始'),node('p',items.length?'試著更換關鍵字，或取消篩選。':'匯入舊版 JSON，就能找回圖片與 Prompt。'));e.append(button(items.length?'清除篩選':'匯入我的收藏',()=>{if(items.length){$('search').value='';activeTags.clear();onlyFav=false;syncFav();render()}else $('importer').showModal()},'primary'));$('grid').append(e)}arr.slice(0,limit).forEach(r=>{const c=node('article',undefined,'card'),p=button('',()=>view(r.id),'picture');p.setAttribute('aria-label','查看 '+r.title);if(r.img){const im=node('img');im.src=r.img;im.loading='lazy';im.alt=r.title||'收藏圖片';p.append(im)}else p.append(node('span','Aa','placeholder'));const body=node('div',undefined,'cardbody'),h=node('h3',r.title||'未命名作品'),tags=node('p',r.tags.join(' · ')||'未分類'),actions=node('div',undefined,'actions'),fav=button(r.favorite?'★':'☆',async()=>{await save({...r,favorite:!r.favorite})});fav.setAttribute('aria-label',r.favorite?'取消常用':'加入常用');fav.setAttribute('aria-pressed',r.favorite);actions.append(button('複製 Prompt',()=>copy(r),'copy'),fav);body.append(h,tags,actions);c.append(p,body);$('grid').append(c)});$('more').hidden=arr.length<=limit;$('more').style.display=arr.length<=limit?'none':'block';try{$('backupState').textContent=localStorage.getItem('atlasBackup')?'上次匯出：'+localStorage.getItem('atlasBackup'):'尚未備份'}catch{}}
function view(id){current=id;const r=items.find(x=>x.id===id);$('viewTitle').textContent=r.title||'未命名作品';$('viewText').textContent=r.text;$('viewTags').textContent=r.tags.join(' · ');$('viewImage').replaceChildren();if(r.img){const im=node('img');im.src=r.img;im.alt=r.title;im.tabIndex=0;im.onclick=()=>{$('largeImage').src=r.img;$('lightbox').showModal()};im.onkeydown=e=>{if(e.key==='Enter')im.click()};$('viewImage').append(im)}else $('viewImage').append(node('p','這筆收藏沒有圖片。'));if(!$('viewer').open)$('viewer').showModal()}
async function copy(r){try{await navigator.clipboard.writeText(r.text)}catch{const ta=node('textarea');ta.value=r.text;const host=document.querySelector('dialog[open]')||document.body;host.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('無法自動複製，請開啟詳情並手動選取文字')}toast('已複製完整 Prompt');await save({...r,lastUsed:new Date().toISOString()})}
function edit(r=null){editing=r;dirty=false;editImage=r?.img||'';$('editHeading').textContent=r?'編輯收藏':'新增收藏';$('titleInput').value=r?.title||'';$('textInput').value=r?.text||'';$('tagsInput').value=r?.tags.join(', ')||'';$('favoriteInput').checked=!!r?.favorite;$('imageInput').value='';$('editPreview').src=editImage;$('editPreview').hidden=!editImage;$('deleteBtn').hidden=!r;$('editor').showModal()}
function closeEdit(){if(busy)return;if(dirty&&!confirm('尚未儲存的修改將捨棄，確定關閉？'))return;$('editor').close()}
function syncFav(){$('favFilter').classList.toggle('selected',onlyFav);$('favFilter').setAttribute('aria-pressed',onlyFav);$('favFilter').textContent=onlyFav?'★ 常用收藏':'☆ 常用收藏'}
$('search').oninput=()=>{limit=24;render()};$('sort').onchange=render;$('favFilter').onclick=()=>{onlyFav=!onlyFav;syncFav();render()};$('more').onclick=()=>{limit+=24;render()};$('newBtn').onclick=()=>edit();$('editBtn').onclick=()=>{$('viewer').close();edit(items.find(r=>r.id===current))};$('viewCopy').onclick=()=>copy(items.find(r=>r.id===current)).catch(fail);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{if(!busy)$(b.dataset.close).close()});$('cancelTop').onclick=$('cancelEdit').onclick=closeEdit;$('editor').addEventListener('cancel',e=>{e.preventDefault();closeEdit()});$('editForm').oninput=()=>dirty=true;
$('removeImage').onclick=()=>{editImage='';$('editPreview').hidden=true;$('imageInput').value='';dirty=true};$('imageInput').onchange=async()=>{const f=$('imageInput').files[0];if(!f)return;busy=true;$('saveBtn').disabled=true;try{if(!/^image\/(png|jpeg|webp|gif)$/.test(f.type))throw Error('請選擇 JPG、PNG、WebP 或 GIF');editImage=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(Error('圖片讀取失敗'));fr.readAsDataURL(f)});$('editPreview').src=editImage;$('editPreview').hidden=false;dirty=true}catch(e){fail(e)}finally{busy=false;$('saveBtn').disabled=false}};
$('editForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('saveBtn').disabled=true;try{if(!$('textInput').value.trim()&&!editImage)throw Error('請輸入 Prompt 或加入圖片');const now=new Date().toISOString();await save({id:editing?.id||uid(),title:$('titleInput').value.trim(),text:$('textInput').value,img:editImage,tags:[...new Set($('tagsInput').value.split(/[,，]/).map(t=>t.trim()).filter(Boolean))],favorite:$('favoriteInput').checked,date:editing?.date||now,updatedAt:now,lastUsed:editing?.lastUsed||''});dirty=false;$('editor').close();toast('已儲存')}catch(e){fail(e)}finally{busy=false;$('saveBtn').disabled=false}};
$('deleteBtn').onclick=async()=>{if(!editing||busy||!confirm('確定刪除「'+editing.title+'」？刪除後只能透過備份還原。'))return;try{await transact(s=>s.delete(editing.id));$('editor').close();dirty=false;await reload();toast('已刪除')}catch(e){fail(e)}};
$('importBtn').onclick=()=> $('importer').showModal();$('importer').addEventListener('cancel',e=>{if(busy)e.preventDefault()});
$('importFile').onchange=async()=>{pending=null;$('confirmImport').disabled=true;const f=$('importFile').files[0];if(!f)return;$('importInfo').textContent='正在檢查檔案，圖片較多時請稍候…';try{pending=normalise(JSON.parse(await f.text()));$('importInfo').textContent='格式檢查通過：'+pending.length+' 筆收藏、'+pending.filter(r=>r.img).length+' 張圖片。';$('confirmImport').disabled=false}catch(e){$('importInfo').textContent='檢查失敗：'+e.message}};
function contentKey(r){return JSON.stringify([r.title,r.text,r.img.length])}
$('confirmImport').onclick=async()=>{if(!pending||busy)return;const replace=$('importMode').value==='replace';if(replace&&!confirm('將以 '+pending.length+' 筆資料覆蓋新版的 '+items.length+' 筆收藏。已下載備份並確定繼續？'))return;busy=true;$('confirmImport').disabled=true;$('importFile').disabled=true;$('importInfo').textContent='正在處理圖片與收藏，請勿關閉頁面…';try{let add=pending,skipped=0;if(!replace){const seen=new Map();const remember=r=>{const k=contentKey(r);const bucket=seen.get(k)||[];bucket.push(r);seen.set(k,bucket)};items.forEach(remember);add=[];for(const r of pending){const same=(seen.get(contentKey(r))||[]).some(x=>x.img===r.img);if(same)skipped++;else{remember(r);add.push(r)}}}await transact(s=>{if(replace)s.clear();add.forEach(r=>s.put(r))});pending=null;$('importFile').value='';$('importInfo').textContent='匯入完成。';await reload();$('importer').close();toast('已匯入 '+add.length+' 筆，跳過 '+skipped+' 筆重複收藏')}catch(e){$('importInfo').textContent='匯入失敗：'+e.message+'；原有收藏未被覆蓋。';fail(e)}finally{busy=false;$('importFile').disabled=false;$('confirmImport').disabled=!pending}};
$('exportBtn').onclick=()=>{try{const data={format:'prompt-atlas',version:1,exportedAt:new Date().toISOString(),items};const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download='PromptAtlas_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);try{localStorage.setItem('atlasBackup',new Date().toLocaleString('zh-TW'))}catch{}render();toast('已開始下載備份，請確認檔案已存妥')}catch(e){fail(e)}};
window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue=''}});
const req=indexedDB.open('PromptAtlasLocal',1);req.onupgradeneeded=()=>req.result.createObjectStore('prompts',{keyPath:'id'});req.onsuccess=()=>{db=req.result;db.onversionchange=()=>{db.close();toast('請重新整理以載入新版')};reload().catch(fail)};req.onerror=()=>{$('result').textContent='無法開啟本機資料庫，請用一般瀏覽模式開啟 HTTPS 網站。';fail(req.error)};
</script></html>

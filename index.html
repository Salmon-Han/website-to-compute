<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關東自駕遊 2025</title>
    
    <!-- Tailwind CSS (樣式庫) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 設定 Import Map，讓瀏覽器知道去哪裡抓 React 和 Lucide 圖示庫 -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0"
      }
    }
    </script>

    <!-- Babel (讓瀏覽器看懂 JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 隱藏卷軸但保留功能 */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fade-in 0.2s ease-out;
        }
        body {
            background-color: #f9fafb; /* gray-50 */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 這裡開始是 React 程式碼 -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import ReactDOM from 'react-dom/client';
        import { 
          Car, MapPin, Calendar, CheckSquare, Navigation, Info, Fuel, 
          AlertTriangle, Edit2, Save, Sparkles, Plus, Trash2, Image as ImageIcon, 
          X, Clock, Map as MapIcon, Route, Wallet, ShoppingBag, DollarSign, 
          Utensils, Train, Gift, Search, Camera
        } from 'lucide-react';

        const App = () => {
          const [activeTab, setActiveTab] = useState('itinerary');
          const [selectedDay, setSelectedDay] = useState(1);
          const [isEditing, setIsEditing] = useState(false); // Global edit for itinerary list
          const [selectedRoute, setSelectedRoute] = useState(null);
          
          // Modal specific editing state (Itinerary)
          const [isModalEditing, setIsModalEditing] = useState(false);
          const [modalEditData, setModalEditData] = useState({ image: '', note: '', desc: '', noteImage: '' });

          // --- 購物清單 State ---
          const [newShoppingItem, setNewShoppingItem] = useState('');
          const [shoppingList, setShoppingList] = useState([
            { id: 1, text: '合利他命', checked: false, image: '', note: '要買大罐的' },
            { id: 2, text: '東京香蕉 (Tokyo Banana)', checked: false, image: '', note: '機場免稅店買' },
            { id: 3, text: 'Uniqlo 發熱衣', checked: false, image: '', note: '幫家人代購' },
          ]);
          const [selectedShoppingItem, setSelectedShoppingItem] = useState(null);
          const [shoppingModalData, setShoppingModalData] = useState({ image: '', note: '' });
          const [isShoppingModalEditing, setIsShoppingModalEditing] = useState(false);

          // --- 行前準備 State ---
          const [newChecklistItem, setNewChecklistItem] = useState('');
          const [checklist, setChecklist] = useState([
            { id: 1, text: '護照 (有效期6個月以上)', checked: true },
            { id: 2, text: '台灣駕照正本', checked: true },
            { id: 3, text: '日文駕照譯本 (去監理站申請)', checked: false },
            { id: 4, text: '預約租車 (確認包含ETC卡)', checked: false },
            { id: 5, text: '購買旅遊保險', checked: false },
            { id: 6, text: '申請 Visit Japan Web', checked: false },
            { id: 7, text: '準備車充/手機架', checked: false },
          ]);

          // --- 記帳 State ---
          const [expenses, setExpenses] = useState([
            { id: 1, title: '租車費用 (預估)', amount: 25000, category: 'transport', day: 1, time: '14:30' },
            { id: 2, title: '便利商店飲料', amount: 350, category: 'food', day: 1, time: '15:00' },
          ]);
          // Editing expense state
          const [expenseForm, setExpenseForm] = useState({ id: null, title: '', amount: '', category: 'food', time: '' });

          // 初始行程數據
          const initialItinerary = [
            {
              day: 1,
              title: "抵達東京 & 取車",
              date: "2025-10-10",
              routes: [
                { 
                  id: 101, 
                  time: "14:00", 
                  location: "成田機場", 
                  note: "辦理入境，前往租車櫃檯取車", 
                  type: "start", 
                  image: "https://image.pollinations.ai/prompt/Narita%20Airport%20winter%20japan?width=600&height=400&nologo=true", 
                  desc: "日本主要國際機場，租車櫃台位於1樓。入境手續約需1小時。",
                  noteImage: "",
                  distanceToNext: "45km",
                  timeToNext: "50分"
                },
                { 
                  id: 102, 
                  time: "16:00", 
                  location: "橫濱紅磚倉庫", 
                  note: "開車適應右駕，欣賞港灣夜景", 
                  type: "spot", 
                  image: "https://image.pollinations.ai/prompt/Yokohama%20Red%20Brick%20Warehouse%20winter%20night?width=600&height=400&nologo=true", 
                  desc: "充滿異國風情的歷史建築，冬季有著名的聖誕市集。",
                  noteImage: "",
                  distanceToNext: "2km",
                  timeToNext: "10分"
                },
                { 
                  id: 103, 
                  time: "19:00", 
                  location: "橫濱皇家花園酒店", 
                  note: "確認飯店停車場位置", 
                  type: "hotel", 
                  image: "https://image.pollinations.ai/prompt/Yokohama%20Royal%20Park%20Hotel%20night?width=600&height=400&nologo=true", 
                  desc: "位於橫濱地標塔內的高空飯店，可俯瞰整個橫濱港灣美景。",
                  noteImage: "",
                  distanceToNext: "",
                  timeToNext: ""
                }
              ]
            },
            {
              day: 2,
              title: "箱根溫泉之旅",
              date: "2025-10-11",
              routes: [
                { 
                  id: 201, 
                  time: "09:00", 
                  location: "海老名SA", 
                  note: "必吃哈密瓜麵包", 
                  type: "drive", 
                  image: "https://image.pollinations.ai/prompt/Ebina%20Service%20Area%20japan?width=600&height=400&nologo=true", 
                  desc: "日本最著名的高速公路休息站之一。",
                  noteImage: "",
                  distanceToNext: "50km",
                  timeToNext: "60分"
                },
                { 
                  id: 202, 
                  time: "11:00", 
                  location: "大涌谷", 
                  note: "吃黑蛋，看火山地熱", 
                  type: "spot", 
                  image: "https://image.pollinations.ai/prompt/Owakudani%20Hakone%20winter%20steam?width=600&height=400&nologo=true", 
                  desc: "箱根著名的火山地形，特產是延年益壽的黑蛋。",
                  noteImage: "",
                  distanceToNext: "5km",
                  timeToNext: "15分"
                },
                { 
                  id: 203, 
                  time: "14:00", 
                  location: "蘆之湖海賊船", 
                  note: "可將車停在桃源台港", 
                  type: "spot", 
                  image: "https://image.pollinations.ai/prompt/Lake%20Ashi%20pirate%20ship%20winter%20fuji?width=600&height=400&nologo=true", 
                  desc: "搭乘特色海賊船遊湖，天氣好可見富士山。",
                  noteImage: "",
                  distanceToNext: "8km",
                  timeToNext: "20分"
                },
                { 
                  id: 204, 
                  time: "17:00", 
                  location: "箱根強羅溫泉", 
                  note: "享受一泊二食", 
                  type: "hotel", 
                  image: "", 
                  desc: "箱根著名的溫泉區。",
                  noteImage: "",
                  distanceToNext: "",
                  timeToNext: ""
                }
              ]
            },
            {
              day: 3,
              title: "富士山河口湖",
              date: "2025-10-12",
              routes: [
                { 
                  id: 301, 
                  time: "09:30", 
                  location: "御殿場Outlet", 
                  note: "看富士山逛街，午餐", 
                  type: "shopping", 
                  image: "https://image.pollinations.ai/prompt/Gotemba%20Premium%20Outlets%20winter%20fuji?width=600&height=400&nologo=true", 
                  desc: "日本最大暢貨中心，擁有絕佳富士山景。",
                  noteImage: "",
                  distanceToNext: "20km",
                  timeToNext: "30分"
                },
                { 
                  id: 302, 
                  time: "14:00", 
                  location: "忍野八海", 
                  note: "湧泉名水百選", 
                  type: "spot", 
                  image: "https://image.pollinations.ai/prompt/Oshino%20Hakkai%20winter%20snow?width=600&height=400&nologo=true", 
                  desc: "富士山融雪形成的八個清澈池塘。",
                  noteImage: "",
                  distanceToNext: "12km",
                  timeToNext: "25分"
                },
                { 
                  id: 303, 
                  time: "16:00", 
                  location: "河口湖", 
                  note: "拍攝逆富士 (需早起)", 
                  type: "spot", 
                  image: "https://image.pollinations.ai/prompt/Lake%20Kawaguchiko%20winter%20mt%20fuji?width=600&height=400&nologo=true", 
                  desc: "富士五湖中最著名的景點。",
                  noteImage: "",
                  distanceToNext: "",
                  timeToNext: ""
                }
              ]
            }
          ];

          const [itinerary, setItinerary] = useState(initialItinerary);

          // Initialize expense form time
          useEffect(() => {
            const now = new Date();
            const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            setExpenseForm(prev => ({ ...prev, time: timeString }));
          }, []);

          const getDayOfWeek = (dateString) => {
            if (!dateString) return '';
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return '';
            return `(${days[date.getDay()]})`;
          };

          // --- Checklist Functions ---
          const toggleCheck = (id) => {
            setChecklist(checklist.map(item => 
              item.id === id ? { ...item, checked: !item.checked } : item
            ));
          };

          const handleAddChecklistItem = () => {
            if (!newChecklistItem.trim()) return;
            setChecklist([...checklist, {
              id: Date.now(),
              text: newChecklistItem,
              checked: false
            }]);
            setNewChecklistItem('');
          };

          const handleDeleteChecklistItem = (id) => {
            setChecklist(checklist.filter(item => item.id !== id));
          };

          // --- Shopping List Functions ---
          const toggleShoppingCheck = (id) => {
            setShoppingList(shoppingList.map(item => 
              item.id === id ? { ...item, checked: !item.checked } : item
            ));
          };

          const handleAddShoppingItem = () => {
            if (!newShoppingItem.trim()) return;
            setShoppingList([...shoppingList, {
              id: Date.now(),
              text: newShoppingItem,
              checked: false,
              image: '',
              note: ''
            }]);
            setNewShoppingItem('');
          };

          const handleDeleteShoppingItem = (id) => {
            setShoppingList(shoppingList.filter(item => item.id !== id));
          };

          const openShoppingModal = (item) => {
            setSelectedShoppingItem(item);
            setShoppingModalData({ image: item.image || '', note: item.note || '' });
            setIsShoppingModalEditing(false);
          };

          const saveShoppingModalChanges = () => {
            if (!selectedShoppingItem) return;
            setShoppingList(shoppingList.map(item => 
              item.id === selectedShoppingItem.id 
                ? { ...item, image: shoppingModalData.image, note: shoppingModalData.note }
                : item
            ));
            setSelectedShoppingItem({ ...selectedShoppingItem, image: shoppingModalData.image, note: shoppingModalData.note });
            setIsShoppingModalEditing(false);
          };

          // --- Wallet Functions ---
          const handleAddOrUpdateExpense = () => {
            if (!expenseForm.title || !expenseForm.amount) return;

            if (expenseForm.id) {
              setExpenses(expenses.map(e => e.id === expenseForm.id ? {
                ...e,
                title: expenseForm.title,
                amount: parseInt(expenseForm.amount),
                category: expenseForm.category,
                time: expenseForm.time,
                day: selectedDay
              } : e));
            } else {
              setExpenses([...expenses, {
                id: Date.now(),
                title: expenseForm.title,
                amount: parseInt(expenseForm.amount),
                category: expenseForm.category,
                day: selectedDay,
                time: expenseForm.time
              }]);
            }
            
            const now = new Date();
            const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            setExpenseForm({ id: null, title: '', amount: '', category: 'food', time: timeString });
          };

          const handleEditExpense = (expense) => {
            setExpenseForm({
              id: expense.id,
              title: expense.title,
              amount: expense.amount,
              category: expense.category,
              time: expense.time || ''
            });
          };

          const handleDeleteExpense = (id) => {
            setExpenses(expenses.filter(item => item.id !== id));
          };

          const getDailyTotalExpenses = () => {
            return expenses.filter(e => e.day === selectedDay).reduce((sum, item) => sum + item.amount, 0);
          };

          const getGrandTotalExpenses = () => {
            return expenses.reduce((sum, item) => sum + item.amount, 0);
          };

          const getCategoryIcon = (category) => {
            switch(category) {
              case 'food': return <Utensils size={16} className="text-orange-500" />;
              case 'transport': return <Train size={16} className="text-blue-500" />;
              case 'shopping': return <Gift size={16} className="text-pink-500" />;
              default: return <DollarSign size={16} className="text-gray-500" />;
            }
          };

          // --- Itinerary Editing ---
          const handleDayTitleChange = (newTitle) => {
            const newItinerary = [...itinerary];
            newItinerary[selectedDay - 1].title = newTitle;
            setItinerary(newItinerary);
          };

          const handleDayDateChange = (newDate) => {
            const newItinerary = [...itinerary];
            newItinerary[selectedDay - 1].date = newDate;
            setItinerary(newItinerary);
          };

          const handleRouteChange = (routeId, field, value) => {
            const newItinerary = [...itinerary];
            const dayData = newItinerary[selectedDay - 1];
            const routeIndex = dayData.routes.findIndex(r => r.id === routeId);
            if (routeIndex !== -1) {
              dayData.routes[routeIndex][field] = value;
              setItinerary(newItinerary);
            }
          };

          const handleAddRoute = () => {
            const newItinerary = [...itinerary];
            const newId = Date.now();
            newItinerary[selectedDay - 1].routes.push({
              id: newId,
              time: "12:00",
              location: "新景點",
              note: "請輸入備註",
              type: "spot",
              image: "",
              desc: "",
              noteImage: "",
              distanceToNext: "",
              timeToNext: ""
            });
            setItinerary(newItinerary);
          };

          const handleDeleteRoute = (routeId) => {
            const newItinerary = [...itinerary];
            newItinerary[selectedDay - 1].routes = newItinerary[selectedDay - 1].routes.filter(r => r.id !== routeId);
            setItinerary(newItinerary);
          };

          const handleAIGenerate = (routeId, location) => {
            if (!location) return;
            const keyword = encodeURIComponent(`${location} japan winter scenery`);
            const mockImage = `https://image.pollinations.ai/prompt/${keyword}?width=600&height=400&nologo=true`;
            const mockDesc = `【AI 摘要】${location} 是關東地區熱門的旅遊點，冬季時景色特別優美，建議預留 1-2 小時參觀。`;

            const newItinerary = [...itinerary];
            const dayData = newItinerary[selectedDay - 1];
            const routeIndex = dayData.routes.findIndex(r => r.id === routeId);
            if (routeIndex !== -1) {
              dayData.routes[routeIndex].image = mockImage;
              dayData.routes[routeIndex].desc = mockDesc;
              setItinerary(newItinerary);
            }
          };

          // --- Modal Editing ---
          const openRouteModal = (route) => {
            setSelectedRoute(route);
            setIsModalEditing(false);
            setModalEditData({
              image: route.image || '',
              note: route.note || '',
              desc: route.desc || '',
              noteImage: route.noteImage || ''
            });
          };

          const saveModalChanges = () => {
            if (!selectedRoute) return;
            const newItinerary = [...itinerary];
            const dayData = newItinerary[selectedDay - 1];
            const routeIndex = dayData.routes.findIndex(r => r.id === selectedRoute.id);
            
            if (routeIndex !== -1) {
              dayData.routes[routeIndex] = {
                ...dayData.routes[routeIndex],
                image: modalEditData.image,
                note: modalEditData.note,
                desc: modalEditData.desc,
                noteImage: modalEditData.noteImage
              };
              setItinerary(newItinerary);
              setSelectedRoute(dayData.routes[routeIndex]);
              setIsModalEditing(false);
            }
          };

          const drivingTips = [
            { title: "右駕行駛", desc: "日本是右駕左行。雨刷和方向燈位置通常與台灣相反（口訣：右轉大彎，左轉小彎）。", icon: <Car className="w-5 h-5 text-blue-500" /> },
            { title: "ETC 使用", desc: "上高速公路走紫色 'ETC專用' 或綠色 '一般/ETC' 車道。卡片要插緊亮綠燈。速度請降至 20km/h 以下。", icon: <Car className="w-5 h-5 text-purple-500" /> }, 
            { title: "停車規則", desc: "絕對不能路邊違停。請找 'Coin Parking'。停車後記得鎖車，並記下車位號碼去精算機繳費。", icon: <AlertTriangle className="w-5 h-5 text-red-500" /> },
            { title: "加油方式", desc: "紅色油槍(Regular)是92/95無鉛。說 'Regular, Full (Mantan)' 即可。自助加油記得先除靜電。", icon: <Fuel className="w-5 h-5 text-orange-500" /> },
          ];

          const generateGoogleMapsUrl = (dayRoutes) => {
            if (!dayRoutes || dayRoutes.length < 2) return "https://www.google.com/maps";
            const origin = encodeURIComponent(dayRoutes[0].location);
            const destination = encodeURIComponent(dayRoutes[dayRoutes.length - 1].location);
            const waypoints = dayRoutes.slice(1, -1).map(r => encodeURIComponent(r.location)).join('|');
            return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&waypoints=${waypoints}&travelmode=driving`;
          };

          // --- Render Components ---
          const renderHeader = () => (
            <header className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-4 pt-8 shadow-lg">
              <div className="flex justify-between items-center">
                <div>
                  <h1 className="text-xl font-bold flex items-center gap-2">
                    <Car className="w-6 h-6" /> 關東自駕遊 2025
                  </h1>
                  <p className="text-blue-100 text-xs mt-1">Ready for the road trip?</p>
                </div>
                <div className="bg-white/20 p-2 rounded-lg backdrop-blur-sm">
                  <span className="text-xs block text-center">倒數</span>
                  <span className="font-bold block text-center">320天</span>
                </div>
              </div>
            </header>
          );

          const renderItinerary = () => {
            const currentDayData = itinerary[selectedDay - 1];
            return (
              <div className="flex flex-col pb-20 relative">
                <div className="flex overflow-x-auto gap-2 pb-2 mb-2 p-4 scrollbar-hide sticky top-0 bg-gray-50 z-10">
                  {itinerary.map((day) => (
                    <button
                      key={day.day}
                      onClick={() => setSelectedDay(day.day)}
                      className={`flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold transition-all whitespace-nowrap shadow-sm
                        ${selectedDay === day.day 
                          ? 'bg-blue-600 text-white' 
                          : 'bg-white text-gray-500 border border-gray-200'}`}
                    >
                      Day {day.day}
                    </button>
                  ))}
                  <button className="flex-shrink-0 px-3 py-2 rounded-full bg-gray-100 text-gray-400 border border-gray-200 shadow-sm">
                    <Plus size={16} />
                  </button>
                </div>

                <div className="px-4">
                  <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                    <div className="bg-gradient-to-r from-blue-50 to-white p-4 border-b border-blue-100 flex justify-between items-center">
                       <div className="flex-1">
                         <div className="text-blue-600 font-bold mb-1 flex items-center gap-2">
                           <Calendar size={14}/> 
                           {isEditing ? (
                             <input 
                               type="date"
                               value={currentDayData.date}
                               onChange={(e) => handleDayDateChange(e.target.value)}
                               className="bg-white border border-blue-300 rounded px-2 py-0.5 text-sm focus:ring-2 focus:ring-blue-200 outline-none"
                             />
                           ) : (
                             <span className="text-sm">{currentDayData.date} <span className="text-blue-400">{getDayOfWeek(currentDayData.date)}</span></span>
                           )}
                         </div>
                         {isEditing ? (
                           <input 
                             type="text" 
                             value={currentDayData.title}
                             onChange={(e) => handleDayTitleChange(e.target.value)}
                             className="w-full text-lg font-bold bg-white border border-blue-300 rounded px-2 py-1 text-gray-800"
                           />
                         ) : (
                           <h2 className="text-xl font-bold text-gray-800">{currentDayData.title}</h2>
                         )}
                       </div>
                       <button 
                         onClick={() => setIsEditing(!isEditing)}
                         className={`p-2 rounded-full transition-colors ${isEditing ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                       >
                         {isEditing ? <Save size={18} /> : <Edit2 size={18} />}
                       </button>
                    </div>

                    <div className="p-4">
                      <div className="space-y-0 relative">
                        <div className="absolute left-4 top-4 bottom-4 w-0.5 bg-gray-200"></div>
                        {currentDayData.routes.map((route, index) => (
                          <div key={route.id} className="relative pl-10 pb-6 group">
                            <div className={`absolute left-2.5 top-1.5 w-3 h-3 -ml-1.5 rounded-full border-2 border-white shadow-sm z-10
                              ${route.type === 'start' ? 'bg-green-500' : 
                                route.type === 'hotel' ? 'bg-purple-500' : 
                                route.type === 'drive' ? 'bg-gray-500' : 'bg-blue-500'}`}>
                            </div>

                            <div 
                              onClick={() => !isEditing && openRouteModal(route)}
                              className={`rounded-lg transition-all

                           {isShoppingModalEditing ? <Save size={20}/> : <Edit2 size={20}/>}
                         </button>
                         <button onClick={() => setSelectedShoppingItem(null)} className="p-1 hover:bg-pink-600 rounded"><X size={20}/></button>
                       </div>
                     </div>
                     
                     <div className="p-5 space-y-4">
                       {isShoppingModalEditing ? (
                         <>
                           <div>
                             <label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1 block">商品圖片 (URL)</label>
                             <input 
                               type="text" 
                               value={shoppingModalData.image}
                               onChange={(e) => setShoppingModalData({...shoppingModalData, image: e.target.value})}
                               className="w-full text-sm border border-gray-300 rounded p-2 outline-none focus:border-pink-300"
                               placeholder="https://..."
                             />
                           </div>
                           <div>
                             <label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1 block">備註說明</label>
                             <textarea 
                               value={shoppingModalData.note}
                               onChange={(e) => setShoppingModalData({...shoppingModalData, note: e.target.value})}
                               className="w-full text-sm border border-gray-300 rounded p-2 outline-none focus:border-pink-300 h-24"
                               placeholder="例如：要買XL號、紅色、預算5000日圓..."
                             />
                           </div>
                         </>
                       ) : (
                         <>
                           {selectedShoppingItem.image ? (
                             <div className="rounded-lg overflow-hidden border border-gray-200 bg-gray-50">
                               <img src={selectedShoppingItem.image} alt={selectedShoppingItem.text} className="w-full h-48 object-cover" />
                             </div>
                           ) : (
                             <div className="h-32 bg-gray-50 rounded-lg border border-dashed border-gray-300 flex flex-col items-center justify-center text-gray-400">
                               <Camera size={24} className="mb-1"/>
                               <span className="text-xs">點擊右上角編輯新增圖片</span>
                             </div>
                           )}
                           <div>
                             <h4 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">詳細備註</h4>
                             <p className="text-gray-800 bg-gray-50 p-3 rounded-lg border border-gray-100 text-sm min-h-[60px]">
                               {selectedShoppingItem.note || "尚無備註"}
                             </p>
                           </div>
                         </>
                       )}
                     </div>
                  </div>
                </div>
              )}
            </div>
          );

          const renderDrivingInfo = () => (
            <div className="space-y-4 pb-20 p-4">
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-white p-3 rounded-lg shadow-sm border border-gray-100 text-center">
                  <div className="text-2xl font-bold text-red-500">110</div>
                  <div className="text-xs text-gray-500">火警/救護車</div>
                </div>
                <div className="bg-white p-3 rounded-lg shadow-sm border border-gray-100 text-center">
                  <div className="text-2xl font-bold text-blue-500">110</div>
                  <div className="text-xs text-gray-500">警察局</div>
                </div>
              </div>
              <h3 className="font-bold text-gray-800 mt-2 px-1">自駕關鍵規則</h3>
              {drivingTips.map((tip, index) => (
                <div key={index} className="bg-white p-4 rounded-lg shadow-sm border border-gray-100 flex gap-4">
                  <div className="flex-shrink-0 mt-1 bg-gray-50 p-2 rounded-full h-fit">
                    {tip.icon}
                  </div>
                  <div>
                    <h4 className="font-bold text-gray-800">{tip.title}</h4>
                    <p className="text-sm text-gray-600 mt-1 leading-relaxed">{tip.desc}</p>
                  </div>
                </div>
              ))}
            </div>
          );

          return (
            <div className="max-w-md mx-auto h-screen bg-gray-50 flex flex-col font-sans text-gray-900 overflow-hidden shadow-2xl">
              <main className="flex-1 overflow-y-auto scrollbar-hide">
                {renderHeader()}
                {activeTab === 'itinerary' && renderItinerary()}
                {activeTab === 'map' && renderMap()}
                {activeTab === 'wallet' && renderWallet()}
                {activeTab === 'checklist' && renderChecklist()}
                {activeTab === 'info' && renderDrivingInfo()}
              </main>

              <nav className="bg-white border-t border-gray-200 flex justify-between items-center px-4 py-2 pb-6 absolute bottom-0 w-full max-w-md shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] text-[10px] z-50">
                <button onClick={() => setActiveTab('itinerary')} className={`flex flex-col items-center gap-1 ${activeTab === 'itinerary' ? 'text-blue-600' : 'text-gray-400'}`}>
                  <MapPin size={20} fill={activeTab === 'itinerary' ? "currentColor" : "none"} />
                  <span className="font-medium">行程</span>
                </button>
                <button onClick={() => setActiveTab('map')} className={`flex flex-col items-center gap-1 ${activeTab === 'map' ? 'text-blue-600' : 'text-gray-400'}`}>
                  <MapIcon size={20} fill={activeTab === 'map' ? "currentColor" : "none"} />
                  <span className="font-medium">地圖</span>
                </button>
                <button onClick={() => setActiveTab('wallet')} className={`flex flex-col items-center gap-1 ${activeTab === 'wallet' ? 'text-green-600' : 'text-gray-400'}`}>
                  <Wallet size={20} fill={activeTab === 'wallet' ? "currentColor" : "none"} />
                  <span className="font-medium">記帳</span>
                </button>
                <button onClick={() => setActiveTab('checklist')} className={`flex flex-col items-center gap-1 ${activeTab === 'checklist' ? 'text-blue-600' : 'text-gray-400'}`}>
                  <CheckSquare size={20} fill={activeTab === 'checklist' ? "currentColor" : "none"} />
                  <span className="font-medium">準備</span>
                </button>
                <button onClick={() => setActiveTab('info')} className={`flex flex-col items-center gap-1 ${activeTab === 'info' ? 'text-blue-600' : 'text-gray-400'}`}>
                  <Navigation size={20} fill={activeTab === 'info' ? "currentColor" : "none"} />
                  <span className="font-medium">攻略</span>
                </button>
              </nav>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
